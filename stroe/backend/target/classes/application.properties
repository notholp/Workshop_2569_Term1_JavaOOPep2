spring.application.name=stroe

server.port=2424

# Database Configuration MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/store_2569_term2
spring.datasource.username=root
spring.datasource.password=1234

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Settings
jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_RANDOM_SECRET_AT_LEAST_32_CHARACTERS}
jwt.expiration-ms=15552000000

# Local Image Storage
app.upload-dir=${APP_UPLOAD_DIR:uploads}
app.backend-base-url=${APP_BACKEND_BASE_URL:http://localhost:2424}